<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="修子的个人博客，专注全栈实战，分享踩坑笔记" />
    <title>修子的日记</title>
    <style>
      /* 初始加载样式 - 在 React 加载前显示 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f5f7fa;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #1a1a1a;
        }
        #initial-loader .loader-title {
          color: #e0e0e0 !important;
        }
        #initial-loader .loader-subtitle {
          color: #9ca3af !important;
        }
      }
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 32px;
      }
      .spinner-ring-1 {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(64, 158, 255, 0.15);
        border-radius: 50%;
      }
      .spinner-ring-2 {
        position: absolute;
        inset: 0;
        border: 4px solid transparent;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: initial-spin 1s linear infinite;
      }
      .spinner-ring-3 {
        position: absolute;
        inset: 8px;
        border: 4px solid transparent;
        border-bottom-color: #67c23a;
        border-radius: 50%;
        animation: initial-spin 3s linear infinite reverse;
      }
      .spinner-dots {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 4px;
      }
      .spinner-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: dot-pulse 1.4s infinite ease-in-out both;
      }
      .spinner-dots span:nth-child(1) {
        background-color: #409eff;
        animation-delay: -0.32s;
      }
      .spinner-dots span:nth-child(2) {
        background-color: #67c23a;
        animation-delay: -0.16s;
      }
      .spinner-dots span:nth-child(3) {
        background-color: #409eff;
        animation-delay: 0s;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 600;
        color: #303133;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .loader-title .dot-group {
        display: inline-flex;
        gap: 3px;
      }
      .loader-title .dot-group span {
        width: 6px;
        height: 6px;
        background: #409eff;
        border-radius: 50%;
        animation: dot-bounce 1.4s infinite ease-in-out both;
      }
      .loader-title .dot-group span:nth-child(1) { animation-delay: -0.32s; }
      .loader-title .dot-group span:nth-child(2) { animation-delay: -0.16s; }
      .loader-title .dot-group span:nth-child(3) { animation-delay: 0s; }
      .loader-subtitle {
        font-size: 14px;
        color: #909399;
        margin-bottom: 24px;
      }
      .loader-progress {
        width: 200px;
        height: 4px;
        background: rgba(64, 158, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .loader-progress::after {
        content: '';
        position: absolute;
        top: 0;
        height: 100%;
        background: linear-gradient(90deg, #409eff, #67c23a);
        border-radius: 2px;
        animation: progress-move 2s ease-in-out infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes dot-pulse {
        0%, 80%, 100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes dot-bounce {
        0%, 80%, 100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @keyframes progress-move {
        0% {
          width: 0%;
          left: 0;
        }
        50% {
          width: 60%;
          left: 20%;
        }
        100% {
          width: 0%;
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner-wrapper">
        <div class="spinner-ring-1"></div>
        <div class="spinner-ring-2"></div>
        <div class="spinner-ring-3"></div>
        <div class="spinner-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="loader-title">
        修子的日记
        <span class="dot-group">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
      <div class="loader-subtitle">正在准备精彩内容...</div>
      <div class="loader-progress"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 当 React 应用挂载完成后，隐藏初始加载器
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() {
              loader.remove();
            }, 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
